name: React vite CI
on:
  push:
    branches:
      -main
  pull_request:
    branches:
      -main

job:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: descargar codigo

      - name: instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar dependencias
        run: npm ci
      
      - name: construir la aplicación de js
        run: npm run build
    